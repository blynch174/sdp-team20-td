<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23b3b"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
  </defs>
  <rect x="0" y="0" width="1500" height="960" fill="#ffffff"/>

  <!-- ===== Row A: start, prep, questions ===== -->
  <rect x="30" y="80" width="190" height="80" rx="8" fill="#fff" stroke="#333" stroke-width="1.8"/>
  <text x="125" y="114" font-size="20" font-weight="bold" text-anchor="middle">Data + FSAE</text>
  <text x="125" y="139" font-size="20" font-weight="bold" text-anchor="middle">input</text>
  <line x1="220" y1="120" x2="258" y2="120" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="260" y="80" width="250" height="80" rx="8" fill="#fff" stroke="#333" stroke-width="1.8"/>
  <text x="385" y="114" font-size="19" text-anchor="middle">Clean data +</text>
  <text x="385" y="139" font-size="19" text-anchor="middle">build live features</text>
  <line x1="510" y1="120" x2="538" y2="120" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/>

  <polygon points="540,120 705,38 870,120 705,202" fill="#fff8e1" stroke="#b28704" stroke-width="2"/>
  <text x="705" y="115" font-size="18" text-anchor="middle">Confirmed, labeled</text>
  <text x="705" y="138" font-size="18" text-anchor="middle">problem events?</text>
  <line x1="870" y1="120" x2="953" y2="120" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="912" y="108" font-size="17" font-weight="bold" text-anchor="middle" fill="#b23b3b">No</text>

  <polygon points="955,120 1120,38 1285,120 1120,202" fill="#fff8e1" stroke="#b28704" stroke-width="2"/>
  <text x="1120" y="115" font-size="18" text-anchor="middle">Does a signal's</text>
  <text x="1120" y="138" font-size="18" text-anchor="middle">future value matter?</text>
  <polyline points="1285,120 1372,120 1372,273" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="1330" y="108" font-size="17" font-weight="bold" text-anchor="middle" fill="#b23b3b">No</text>

  <!-- ===== Row B: task types ===== -->
  <line x1="705" y1="202" x2="705" y2="273" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="717" y="244" font-size="17" font-weight="bold" fill="#2e7d32">Yes</text>
  <line x1="1120" y1="202" x2="1120" y2="273" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="1132" y="244" font-size="17" font-weight="bold" fill="#2e7d32">Yes</text>

  <rect x="575" y="275" width="260" height="90" rx="8" fill="#eef4fb" stroke="#1f5fbf" stroke-width="2"/>
  <text x="705" y="304" font-size="20" font-weight="bold" text-anchor="middle" fill="#123c7a">Classification</text>
  <text x="705" y="330" font-size="16" text-anchor="middle" fill="#444">tells problem events apart</text>
  <text x="705" y="350" font-size="16" text-anchor="middle" fill="#444">from normal driving</text>

  <rect x="985" y="275" width="250" height="90" rx="8" fill="#eef4fb" stroke="#1f5fbf" stroke-width="2"/>
  <text x="1110" y="304" font-size="20" font-weight="bold" text-anchor="middle" fill="#123c7a">Regression</text>
  <text x="1110" y="330" font-size="16" text-anchor="middle" fill="#444">forecasting: predicts a</text>
  <text x="1110" y="350" font-size="16" text-anchor="middle" fill="#444">value ahead of time</text>

  <rect x="1260" y="275" width="225" height="90" rx="8" fill="#eef4fb" stroke="#1f5fbf" stroke-width="2"/>
  <text x="1372" y="304" font-size="20" font-weight="bold" text-anchor="middle" fill="#123c7a">Anomaly detection</text>
  <text x="1372" y="330" font-size="16" text-anchor="middle" fill="#444">flags unusual readings</text>
  <text x="1372" y="350" font-size="16" text-anchor="middle" fill="#444">to investigate</text>

  <line x1="705" y1="365" x2="705" y2="428" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="1110" y1="365" x2="1110" y2="428" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="1372" y1="365" x2="1372" y2="428" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- ===== Row C: model ladder ===== -->
  <rect x="300" y="430" width="1185" height="150" rx="10" fill="#f4f4f4" stroke="#999" stroke-width="1.8"/>
  <text x="320" y="458" font-size="18" font-weight="bold" fill="#333">Model ladder: each step must beat the one before it</text>

  <rect x="320" y="475" width="330" height="90" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="485" y="503" font-size="19" font-weight="bold" text-anchor="middle">1  Baseline models</text>
  <text x="485" y="529" font-size="16" text-anchor="middle" fill="#555">value stays the same,</text>
  <text x="485" y="549" font-size="16" text-anchor="middle" fill="#555">fixed threshold</text>
  <line x1="650" y1="520" x2="698" y2="520" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="700" y="475" width="380" height="90" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="890" y="503" font-size="19" font-weight="bold" text-anchor="middle">2  Classical ML models</text>
  <text x="890" y="529" font-size="16" text-anchor="middle" fill="#555">linear + logistic regression, random</text>
  <text x="890" y="549" font-size="16" text-anchor="middle" fill="#555">forest, gradient boosting, Isolation Forest</text>
  <line x1="1080" y1="520" x2="1128" y2="520" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="1130" y="475" width="335" height="90" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="1297" y="503" font-size="19" font-weight="bold" text-anchor="middle">3  Sequence models</text>
  <text x="1297" y="529" font-size="16" text-anchor="middle" fill="#555">RNN (LSTM), 1D CNN; read a</text>
  <text x="1297" y="549" font-size="16" text-anchor="middle" fill="#555">window of recent readings</text>

  <!-- ===== Row D: checks ===== -->
  <line x1="560" y1="580" x2="560" y2="608" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/>

  <polygon points="385,690 560,610 735,690 560,770" fill="#fff8e1" stroke="#b28704" stroke-width="2"/>
  <text x="560" y="680" font-size="18" text-anchor="middle">Beats previous step</text>
  <text x="560" y="703" font-size="18" text-anchor="middle">on unseen sessions?</text>
  <text x="560" y="725" font-size="14" text-anchor="middle" fill="#666">(leave-one-session-out)</text>

  <line x1="735" y1="690" x2="808" y2="690" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="772" y="678" font-size="17" font-weight="bold" text-anchor="middle" fill="#2e7d32">Yes</text>

  <polygon points="810,690 960,610 1110,690 960,770" fill="#fff8e1" stroke="#b28704" stroke-width="2"/>
  <text x="960" y="688" font-size="18" text-anchor="middle">Fits on the Pi?</text>
  <text x="960" y="711" font-size="14" text-anchor="middle" fill="#666">(time, memory)</text>

  <line x1="960" y1="610" x2="960" y2="583" stroke="#b23b3b" stroke-width="2.5" marker-end="url(#a-red)"/>
  <text x="972" y="602" font-size="15" font-weight="bold" fill="#b23b3b">No: use a smaller model</text>

  <polyline points="385,690 160,690 160,230 385,230 385,163" fill="none" stroke="#b23b3b" stroke-width="2.5" marker-end="url(#a-red)"/>
  <text x="172" y="440" font-size="15" font-weight="bold" fill="#b23b3b">No: improve</text>
  <text x="172" y="459" font-size="15" font-weight="bold" fill="#b23b3b">data + features</text>

  <line x1="1110" y1="690" x2="1178" y2="690" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="1144" y="678" font-size="17" font-weight="bold" text-anchor="middle" fill="#2e7d32">Yes</text>

  <rect x="1180" y="650" width="260" height="80" rx="8" fill="#eaf6ec" stroke="#2e7d32" stroke-width="2"/>
  <text x="1310" y="686" font-size="20" font-weight="bold" text-anchor="middle" fill="#1b5e20">Deploy on the Pi</text>
  <text x="1310" y="711" font-size="16" text-anchor="middle" fill="#444">runs live on the car</text>

  <!-- ===== Row E: feedback loop ===== -->
  <line x1="1310" y1="730" x2="1310" y2="828" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#a-green)"/>

  <rect x="1180" y="830" width="260" height="70" rx="8" fill="#eaf6ec" stroke="#2e7d32" stroke-width="2"/>
  <text x="1310" y="872" font-size="19" text-anchor="middle">Collect new sessions</text>
  <line x1="1180" y1="865" x2="1102" y2="865" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#a-green)"/>

  <rect x="720" y="830" width="380" height="70" rx="8" fill="#eaf6ec" stroke="#2e7d32" stroke-width="2"/>
  <text x="910" y="872" font-size="19" text-anchor="middle">FSAE reviews flagged events</text>
  <line x1="720" y1="865" x2="602" y2="865" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#a-green)"/>

  <rect x="300" y="830" width="300" height="70" rx="8" fill="#eaf6ec" stroke="#2e7d32" stroke-width="2"/>
  <text x="450" y="872" font-size="19" font-weight="bold" text-anchor="middle" fill="#1b5e20">New labels</text>

  <polyline points="300,865 12,865 12,20 705,20 705,36" fill="none" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#a-green)"/>

  <text x="750" y="940" font-size="18" font-weight="bold" font-style="italic" text-anchor="middle" fill="#1b5e20">Feedback loop: reviewed flags become new labels, which can change the task type</text>
</svg>
