<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a3fb5"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker>
  </defs>
  <rect x="0" y="0" width="1500" height="860" fill="#ffffff"/>

  <!-- ===== Zones ===== -->
  <rect x="15" y="15" width="320" height="740" rx="10" fill="#f7fafd" stroke="#b9c7d6" stroke-width="1.5"/>
  <rect x="15" y="15" width="320" height="56" rx="10" fill="#dbe9f8"/>
  <text x="175" y="52" font-size="26" font-weight="bold" text-anchor="middle" fill="#1a1a1a">1  Sensors</text>
  <text x="175" y="96" font-size="17" font-style="italic" text-anchor="middle" fill="#666">on the car</text>

  <rect x="350" y="15" width="545" height="740" rx="10" fill="#f6fbf7" stroke="#b5ccb9" stroke-width="1.5"/>
  <rect x="350" y="15" width="545" height="56" rx="10" fill="#dcefe0"/>
  <text x="622" y="52" font-size="26" font-weight="bold" text-anchor="middle" fill="#1a1a1a">2  On-car computer</text>
  <text x="622" y="96" font-size="17" font-style="italic" text-anchor="middle" fill="#666">on the car</text>

  <rect x="910" y="15" width="190" height="740" rx="10" fill="#faf8fd" stroke="#c9bfdc" stroke-width="1.5"/>
  <rect x="910" y="15" width="190" height="56" rx="10" fill="#e8e0f5"/>
  <text x="1005" y="52" font-size="26" font-weight="bold" text-anchor="middle" fill="#1a1a1a">3  Radio link</text>
  <text x="1005" y="96" font-size="17" font-style="italic" text-anchor="middle" fill="#666">wireless</text>

  <rect x="1115" y="15" width="370" height="740" rx="10" fill="#f8f8f8" stroke="#c4c4c4" stroke-width="1.5"/>
  <rect x="1115" y="15" width="370" height="56" rx="10" fill="#e6e6e6"/>
  <text x="1300" y="52" font-size="26" font-weight="bold" text-anchor="middle" fill="#1a1a1a">4  Pit station</text>
  <text x="1300" y="96" font-size="17" font-style="italic" text-anchor="middle" fill="#666">in the pit</text>

  <!-- ===== Zone 1: sensors ===== -->
  <text x="35" y="128" font-size="18" font-weight="bold" fill="#444">Already on the CAN bus</text>
  <rect x="35" y="140" width="210" height="58" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="140" y="164" font-size="19" text-anchor="middle">Battery management</text>
  <text x="140" y="187" font-size="19" text-anchor="middle">system</text>
  <rect x="35" y="212" width="210" height="58" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="140" y="248" font-size="19" text-anchor="middle">Motor controller</text>
  <rect x="35" y="284" width="210" height="58" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="140" y="320" font-size="19" text-anchor="middle">Speed sensors</text>

  <line x1="245" y1="169" x2="270" y2="169" stroke="#222" stroke-width="2"/>
  <line x1="245" y1="241" x2="270" y2="241" stroke="#222" stroke-width="2"/>
  <line x1="245" y1="313" x2="270" y2="313" stroke="#222" stroke-width="2"/>
  <rect x="270" y="140" width="28" height="202" rx="4" fill="#333"/>
  <text x="284" y="241" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle" transform="rotate(-90 284 241)" dominant-baseline="middle">CAN bus</text>
  <line x1="298" y1="241" x2="363" y2="241" stroke="#222" stroke-width="2.5" marker-end="url(#a-black)"/>

  <text x="35" y="418" font-size="18" font-weight="bold" fill="#444">Proposed sensors</text>
  <text x="35" y="440" font-size="16" font-style="italic" fill="#666">(pending FSAE approval)</text>
  <rect x="35" y="455" width="210" height="52" rx="6" fill="#fff" stroke="#555" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="140" y="487" font-size="19" text-anchor="middle">Tire temperature</text>
  <rect x="35" y="522" width="210" height="52" rx="6" fill="#fff" stroke="#555" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="140" y="554" font-size="19" text-anchor="middle">Acceleration (IMU)</text>
  <rect x="35" y="589" width="210" height="52" rx="6" fill="#fff" stroke="#555" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="140" y="621" font-size="19" text-anchor="middle">Suspension travel</text>
  <line x1="245" y1="481" x2="275" y2="481" stroke="#222" stroke-width="2"/>
  <line x1="245" y1="548" x2="275" y2="548" stroke="#222" stroke-width="2"/>
  <line x1="245" y1="615" x2="275" y2="615" stroke="#222" stroke-width="2"/>
  <line x1="275" y1="481" x2="275" y2="615" stroke="#222" stroke-width="2"/>
  <polyline points="275,520 558,520" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a-black)"/>
  <text x="430" y="510" font-size="15" text-anchor="middle" fill="#444">I²C / ADC</text>

  <!-- ===== Zone 2: on-car computer ===== -->
  <rect x="365" y="200" width="140" height="82" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="435" y="228" font-size="19" text-anchor="middle">CAN add-on</text>
  <text x="435" y="250" font-size="19" text-anchor="middle">board</text>
  <text x="435" y="272" font-size="15" text-anchor="middle" fill="#666">(MCP2515)</text>
  <line x1="505" y1="241" x2="558" y2="241" stroke="#222" stroke-width="2.5" marker-end="url(#a-black)"/>
  <text x="530" y="230" font-size="15" text-anchor="middle" fill="#444">SPI</text>

  <rect x="560" y="110" width="320" height="430" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="720" y="142" font-size="21" font-weight="bold" text-anchor="middle">Raspberry Pi Zero 2W</text>

  <rect x="580" y="160" width="280" height="66" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="720" y="188" font-size="19" text-anchor="middle">Read + timestamp</text>
  <text x="720" y="211" font-size="16" text-anchor="middle" fill="#666">all signals</text>
  <line x1="720" y1="226" x2="720" y2="246" stroke="#222" stroke-width="2" marker-end="url(#a-black)"/>

  <rect x="580" y="248" width="280" height="66" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="720" y="276" font-size="19" text-anchor="middle">Log every reading</text>
  <text x="720" y="299" font-size="16" text-anchor="middle" fill="#666">to memory card (full rate)</text>
  <line x1="720" y1="314" x2="720" y2="334" stroke="#222" stroke-width="2" marker-end="url(#a-black)"/>

  <rect x="580" y="336" width="280" height="66" rx="6" fill="#dbe8fb" stroke="#1f5fbf" stroke-width="3.5"/>
  <text x="720" y="364" font-size="19" font-weight="bold" text-anchor="middle" fill="#123c7a">Run the model</text>
  <text x="720" y="387" font-size="16" text-anchor="middle" fill="#1f5fbf">data modeling (my part)</text>
  <line x1="720" y1="402" x2="720" y2="422" stroke="#222" stroke-width="2" marker-end="url(#a-black)"/>

  <rect x="580" y="424" width="280" height="66" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="720" y="452" font-size="19" text-anchor="middle">Encrypt + pack</text>
  <text x="720" y="475" font-size="16" text-anchor="middle" fill="#666">summaries and alerts</text>

  <line x1="720" y1="540" x2="720" y2="588" stroke="#222" stroke-width="2.5" marker-end="url(#a-black)"/>
  <text x="732" y="569" font-size="15" fill="#444">UART</text>

  <rect x="600" y="590" width="240" height="62" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="720" y="617" font-size="19" text-anchor="middle">LilyGO T-Beam</text>
  <text x="720" y="639" font-size="16" text-anchor="middle" fill="#666">radio (DuckLink)</text>

  <rect x="370" y="690" width="510" height="52" rx="6" fill="#fff3e6" stroke="#e07b00" stroke-width="2"/>
  <text x="625" y="722" font-size="18" text-anchor="middle" fill="#7a4200">Car low-voltage system  →  isolated 5 V converter</text>
  <line x1="720" y1="690" x2="720" y2="655" stroke="#e07b00" stroke-width="2.5" marker-end="url(#a-orange)"/>
  <line x1="862" y1="690" x2="862" y2="543" stroke="#e07b00" stroke-width="2.5" marker-end="url(#a-orange)"/>

  <!-- ===== Zone 3: radio link ===== -->
  <line x1="840" y1="621" x2="1132" y2="621" stroke="#6a3fb5" stroke-width="3.5" stroke-dasharray="12 8" marker-end="url(#a-purple)"/>
  <text x="1005" y="590" font-size="19" font-weight="bold" text-anchor="middle" fill="#4b2a85">LoRa 915 MHz</text>
  <text x="1005" y="656" font-size="16" text-anchor="middle" fill="#4b2a85">summaries + alerts</text>
  <text x="1005" y="676" font-size="16" text-anchor="middle" fill="#4b2a85">only (a few dozen</text>
  <text x="1005" y="696" font-size="16" text-anchor="middle" fill="#4b2a85">bytes per second)</text>

  <line x1="880" y1="281" x2="1132" y2="345" stroke="#777" stroke-width="2" stroke-dasharray="3 5" marker-end="url(#a-gray)"/>
  <text x="1005" y="236" font-size="15" text-anchor="middle" fill="#666">full logs downloaded</text>
  <text x="1005" y="255" font-size="15" text-anchor="middle" fill="#666">after each run</text>

  <!-- ===== Zone 4: pit station ===== -->
  <rect x="1135" y="130" width="330" height="80" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="1300" y="162" font-size="20" font-weight="bold" text-anchor="middle">Dashboard</text>
  <text x="1300" y="188" font-size="16" text-anchor="middle" fill="#666">live readings + alerts for the pit crew</text>

  <rect x="1135" y="300" width="330" height="100" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="1300" y="338" font-size="20" font-weight="bold" text-anchor="middle">Pit laptop</text>
  <text x="1300" y="366" font-size="17" text-anchor="middle" fill="#444">decrypt  →  store  →  serve</text>
  <line x1="1300" y1="300" x2="1300" y2="213" stroke="#222" stroke-width="2.5" marker-end="url(#a-black)"/>

  <rect x="1135" y="590" width="220" height="62" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="1245" y="627" font-size="19" text-anchor="middle">PapaDuck gateway</text>
  <line x1="1245" y1="590" x2="1245" y2="403" stroke="#222" stroke-width="2.5" marker-end="url(#a-black)"/>

  <rect x="1240" y="690" width="225" height="58" rx="6" fill="#fff" stroke="#777" stroke-width="1.8" stroke-dasharray="3 5"/>
  <text x="1352" y="715" font-size="18" text-anchor="middle" fill="#555">OWL cloud (DMS)</text>
  <text x="1352" y="737" font-size="15" font-style="italic" text-anchor="middle" fill="#777">later</text>
  <line x1="1300" y1="652" x2="1300" y2="687" stroke="#777" stroke-width="2" stroke-dasharray="3 5" marker-end="url(#a-gray)"/>

  <!-- ===== Legend ===== -->
  <line x1="30" y1="805" x2="80" y2="805" stroke="#222" stroke-width="2.5" marker-end="url(#a-black)"/>
  <text x="90" y="811" font-size="17" fill="#333">wired data</text>
  <line x1="260" y1="805" x2="310" y2="805" stroke="#6a3fb5" stroke-width="3.5" stroke-dasharray="12 8" marker-end="url(#a-purple)"/>
  <text x="320" y="811" font-size="17" fill="#333">radio (LoRa)</text>
  <line x1="490" y1="805" x2="540" y2="805" stroke="#e07b00" stroke-width="2.5" marker-end="url(#a-orange)"/>
  <text x="550" y="811" font-size="17" fill="#333">power</text>
  <line x1="660" y1="805" x2="710" y2="805" stroke="#777" stroke-width="2" stroke-dasharray="3 5" marker-end="url(#a-gray)"/>
  <text x="720" y="811" font-size="17" fill="#333">later / after the run</text>
  <rect x="930" y="792" width="44" height="26" rx="4" fill="#fff" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="984" y="811" font-size="17" fill="#333">proposed sensor</text>
  <rect x="1170" y="792" width="44" height="26" rx="4" fill="#dbe8fb" stroke="#1f5fbf" stroke-width="3"/>
  <text x="1224" y="811" font-size="17" fill="#333">my part (data modeling)</text>
</svg>
